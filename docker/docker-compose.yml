services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orch-xarc-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      - ORCH_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: orch-xarc-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
